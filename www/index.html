const lastFx=()=>{for(let i=shapes.length;i--;)if(shapes[i].t==='fx')return shapes[i]};
const act=()=>editing||mv?(editing||mv):tool==='fx'?lastFx():tool==='trig'?shapes.find(s=>s.t==='trig'):shapes[shapes.length-1];
function setUnit(d){for(let i=shapes.length;i--;)if(shapes[i].t==='unit')shapes.splice(i,1);const r=d*Math.PI/180;shapes.push({t:'unit',p:[{x:0,y:0},{x:Math.cos(r),y:Math.sin(r)}],t0:performance.now()})}
function plot(){const el=$('#eq'),src=(el?el.value:EQ).trim(),fn=parse(src);if(!fn){msg='Could not read that. Try: 2x^2 - 3x + 1   or   a*sin(b*x)';return}
 EQ=src;msg='';const ev=$('#eqv');if(ev)ev.innerHTML=rich('$y='+toTex(src)+'$');shapes.push({t:'fx',src,fn,a:GP.a,b:GP.b,c:GP.c,col:GC[shapes.filter(s=>s.t==='fx').length%5],t0:performance.now()})}
function preset(i){const[,e,a,b,c]=PRE[i];EQ=e;GP={a,b,c};const el=$('#eq');if(el)el.value=e;document.querySelectorAll('#fx [data-k]').forEach(r=>{r.value=GP[r.dataset.k];r.nextElementSibling.textContent=GP[r.dataset.k]});plot()}
const sl=(k,l,mn,mx,st,v)=>`<label class="r">${l}<input type="range" data-k="${k}" min="${mn}" max="${mx}" step="${st}" value="${v}"><output>${v}</output></label>`,chips=a=>`<div class="ch">${a.map(v=>`<button data-a="${v}">${v}°</button>`).join('')}</div>`;
function panel(){let h='';
 if(editing)h=editHTML(editing);else if(tool==='fx')h=`<div id="eqv">${rich('$y='+toTex(EQ)+'$')}</div><div class="r"><input type="text" id="eq" value="${EQ}" autocapitalize="off" autocomplete="off" spellcheck="false"><button id="plot">Plot</button></div><div class="ch">${PRE.map((r,i)=>`<button data-i="${i}">${r[0]}</button>`).join('')}</div>`+['a','b','c'].map(k=>sl(k,k,-10,10,.1,GP[k])).join('');
 else if(tool==='trig'){const g=shapes.find(s=>s.t==='trig')||{th:30,h:6};h=chips([30,45,60,90])+sl('th','∠',0,90,1,g.th)+sl('h','hyp',1,8,.5,g.h)}
 else if(tool==='unit'){const u=shapes.find(s=>s.t==='unit');h=chips([30,45,60,90,180,270])+sl('th','θ',0,360,1,u?TH(u.p[1]):30)}
 $('#fx').innerHTML=h;$('#fx').classList.toggle('hide',!h)}
$('#fx').oninput=e=>{const t=e.target;dr();if(t.dataset.f){editField(t.dataset.f,+t.value,t);if(t.type==='range'&&t.nextElementSibling){const q=t.dataset.f;t.nextElementSibling.textContent=q==='size'?t.value+'%':q==='rot'?t.value+'°':f(+t.value,1)}return}if(t.id==='eq'){$('#eqv').innerHTML=rich('$y='+toTex(t.value)+'$');return}const k=t.dataset.k;if(!k)return;const v=+t.value;t.nextElementSibling.textContent=v;
 if(tool==='fx'){GP[k]=v;const g=lastFx();if(g)g[k]=v}
 else if(tool==='trig'){let g=shapes.find(s=>s.t==='trig');if(!g)shapes.push(g={t:'trig',th:30,h:6,t0:0});g[k]=v}
 else if(tool==='unit')setUnit(v)};
$('#fx').onclick=e=>{const sw=e.target.closest('[data-c]');if(sw&&editing){editing.col=sw.dataset.c;dr();return}const b=e.target.closest('button');if(!b)return;
 if(b.dataset.act){doAct(b.dataset.act);return}if(b.dataset.ov){editing.ov=editing.ov||{};editing.ov[b.dataset.ov]=!editing.ov[b.dataset.ov];panel();dr();return}
 if(b.dataset.tg){const g=b.dataset.tg,v=editing[g];editing[g]=!(v===undefined?g==='lab':v);panel();dr();return}
 if(b.id==='ed-x'){closeEdit();return}if(b.id==='plot')plot();else if(b.dataset.i)preset(+b.dataset.i);
 else if(b.dataset.a){const r=$('#fx [data-k=th]');r.value=b.dataset.a;r.dispatchEvent(new Event('input',{bubbles:true}))}};
$('#fx').onkeydown=e=>{if(e.key==='Enter')plot()};
$('#fab').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='pxb'){PX.on=!PX.on;pxPanel();dr();return}
 if(b.id==='max'){const w=$('#work');w.classList.toggle('full');b.textContent=w.classList.contains('full')?'✕':'⛶'}
 else if(b.dataset.z==='0'){Z=1;U=U0;ox=0;oy=['fx','trig','unit'].includes(tool)?-70:0}
 else zoomAt(W/2,H/2,+b.dataset.z)};
function pick(k){tool=k;pend=[];msg='';editing=null;mv=null;sel=null;dr();
 if(k==='fx'&&!lastFx())preset(0);if(k==='trig'&&!shapes.some(s=>s.t==='trig'))shapes.push({t:'trig',th:30,h:6,t0:performance.now()});if(k==='unit'&&!shapes.some(s=>s.t==='unit'))setUnit(30);
 if(['fx','trig','unit'].includes(k)){if(!oy)oy=-70}else if(oy===-70)oy=0;panel();
 document.querySelectorAll('#tools button').forEach(b=>b.classList.toggle('on',b.dataset.t===k))}
$('#tools').onclick=e=>{const b=e.target.closest('button');if(b)pick(b.dataset.t)};
$('#undo').onclick=()=>{pend.length?pend.pop():shapes.pop();msg=''};$('#clear').onclick=()=>{pend=[];shapes.length=0;msg=''};
$('#back').onclick=()=>history.back();
onpopstate=()=>{$('#work').classList.remove('full');$('#max').textContent='⛶';$('#work').classList.add('hide');$('#home').classList.remove('hide')};
$('#grid').innerHTML=Object.entries(MODS).map(([k,m],i)=>`<button class="card${k==='all'?' w':''}" data-m="${k}" style="--i:${i};background:linear-gradient(135deg,${m[2]},${m[2]}99)"><b>${m[0]}</b>${m[1]}</button>`).join('');
$('#grid').onclick=async e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.m;
 $('#lt').textContent='Opening '+MODS[k][1]+'…';$('#ld').textContent=MODS[k][0];$('#load').classList.remove('hide');await sleep(600);
 try{mk=k;mod=MODS[k];shapes=S[k]||(S[k]=[]);sel=null;hideMenu();$('#title').textContent=mod[1];
  $('#tools').innerHTML=mod[3].map((t,i)=>`<button data-t="${t}" style="--i:${i}"><b>${TL[t][0]}</b>${TL[t][1]}</button>`).join('');
  $('#home').classList.add('hide');$('#work').classList.remove('hide');Z=1;ox=oy=0;size();pick(mod[3][0]);history.pushState(1,'');last='';dirty=1;loop(++LP);if(k==='par')toast('Draw 2 parallel lines + a crossing line, then tap ∥')}
 catch(err){console.error(err);toast('Something went wrong: '+err.message)}
 $('#load').classList.add('hide')};
document.oncontextmenu=e=>e.preventDefault();
$('#bg').innerHTML=['∑','π','√','∠','∞','θ','△','○','∫','≈','x²','sin'].map((c,i)=>`<span style="left:${(i*89)%96}%;font-size:${22+(i*7)%30}px;animation-duration:${14+(i*5)%12}s;animation-delay:-${(i*3)%14}s">${c}</span>`).join('');
(async()=>{await sleep(2700);$('#splash').classList.add('out');$('#home').classList.remove('hide');await sleep(700);$('#splash').remove()})();
</script></body></html>
